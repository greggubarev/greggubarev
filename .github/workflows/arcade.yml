name: Update Arcade

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-arcade
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Build contribution animations
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: greggubarev
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: "pacman,minesweeper,bomberman"

      - name: Build Tetris in light colors
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: greggubarev
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: tetromino
          tetromino_count: "5"
          logo: none
          palette: github-light
          animation_duration: "8"
          output_path: dist/tetris-light.svg

      - name: Build Tetris in dark colors
        uses: leereilly/contribution-graph-art@v1
        with:
          github_user_name: greggubarev
          github_token: ${{ secrets.GITHUB_TOKEN }}
          animation_mode: tetromino
          tetromino_count: "5"
          logo: none
          palette: github-dark
          animation_duration: "8"
          output_path: dist/tetris-dark.svg
      - name: Loop Tetris animations
        shell: bash
        run: |
          sed -i 's/repeatCount="1"/repeatCount="indefinite"/g' \
            dist/tetris-light.svg \
            dist/tetris-dark.svg
            
      - name: Publish animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
